name: ci

on:
  push:
  pull_request:

jobs:
  stage0:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build stage0
        run: make -C stage0 CC=${{ matrix.cc }}
      - name: Runner self-test
        run: make -C conformance selftest CC=${{ matrix.cc }}
      - name: Conformance tests
        run: make -C conformance check CC=${{ matrix.cc }}
      - name: Build the Arche compiler with stage0
        run: make -C compiler CC=${{ matrix.cc }}
      - name: Compiler tests
        run: make -C compiler check CC=${{ matrix.cc }}
      - name: Conformance tests, release builds
        run: cd compiler && ARCHE_FLAGS=--release ../conformance/runner/build/runner --timeout 60 --compiler ./arche-build ../conformance/tests
      - name: Fuzz the parser
        run: cd /tmp && python3 -I $GITHUB_WORKSPACE/compiler/fuzz.py $GITHUB_WORKSPACE/compiler/build/arche 60
      - name: Differential, stage0 against the Arche compiler
        run: make -C compiler differential CC=${{ matrix.cc }}
      - name: Install lld and gdb
        run: sudo apt-get update && sudo apt-get install -y lld gdb
      - name: The compiler's own backend, all the tests, and a session in gdb
        run: REQUIRE_GDB=1 make -C compiler check-own CC=${{ matrix.cc }}
      - name: Bootstrap, stage2 == stage3
        run: CC=${{ matrix.cc }} ./bootstrap.sh

  # docs/sprints.md S19: the same compiler and the same library on Windows,
  # built with clang and linked with lld-link against Win32. The image has
  # LLVM and the Windows SDK; make comes from Chocolatey. The checkout is
  # LF, as .gitattributes asks, which the compiler's own source needs.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install make
        run: choco install make --no-progress -y
      - name: Build stage0 and the Arche compiler
        run: make -C stage0 CC=clang && make -C compiler CC=clang
      - name: Compiler and std tests
        run: make -C compiler check CC=clang
      - name: Conformance tests with stage0
        run: make -C conformance check CC=clang
      - name: The build driver and the package manager
        run: make -C conformance && make -C driver && make -C driver check
      - name: Bootstrap, stage2 == stage3
        run: CC=clang ./bootstrap.sh

  # docs/sprints.md S16: freestanding binaries, built with core and alloc
  # only, boot in QEMU on x86-64 and RISC-V 64 and write over serial.
  freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-misc lld
          which qemu-system-riscv64 || sudo apt-get install -y qemu-system-riscv
      - name: Build the Arche compiler
        run: make -C stage0 && make -C compiler
      - name: Boot the freestanding examples
        run: ./freestanding/run.sh x86_64 riscv64

  # docs/sprints.md S20: the crypto library runs in the same time whatever
  # its secrets are (dudect: Welch's t-test on two classes of inputs), and a
  # function that leaks on purpose is caught.
  constant-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Arche compiler
        run: make -C stage0 && make -C compiler
      - name: Time lib/crypto on fixed and random secrets
        run: ./ctcheck/run.sh

  # docs/sprints.md S21, S22: lib/tls against OpenSSL and curl, both ways,
  # lib/http against curl and Chrome, and a minute of fuzzing each.
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Arche compiler
        run: make -C stage0 && make -C compiler
      - name: Interop with OpenSSL and curl
        run: ./interop/tls.sh
      - name: Fuzz TLS
        run: ./fuzz/tls.sh 60
      - name: HTTP interop with curl and Chrome
        run: ./interop/http.sh
      - name: Fuzz HTTP
        run: ./fuzz/http.sh 60

  # docs/sprints.md S24, S25: the build driver and the package manager. A
  # build from the cache is bit-identical to a clean one, every conformance
  # test passes when each module is compiled on its own, and packages with
  # a bad hash or signature are refused.
  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build the Arche compiler and the driver
        run: make -C stage0 && make -C compiler && make -C conformance && make -C driver
      - name: Cached builds, signed packages over HTTPS, a language server session
        run: make -C driver check
      - name: Fuzz the language server's message parser
        run: ./fuzz/lsp.sh 60
      - name: Conformance tests, one object per module
        run: cd compiler && ../conformance/runner/build/runner --timeout 60 --compiler ./arche-build-units ../conformance/tests
