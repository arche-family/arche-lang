name: ci

on:
  push:
  pull_request:

jobs:
  stage0:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build stage0
        run: make -C stage0 CC=${{ matrix.cc }}
      - name: Runner self-test
        run: make -C conformance selftest CC=${{ matrix.cc }}
      - name: Conformance tests
        run: make -C conformance check CC=${{ matrix.cc }}
      - name: Build the Arche compiler with stage0
        run: make -C compiler CC=${{ matrix.cc }}
      - name: Compiler tests
        run: make -C compiler check CC=${{ matrix.cc }}
      - name: Conformance tests, release builds
        run: cd compiler && ARCHE_FLAGS=--release ../conformance/runner/build/runner --timeout 60 --compiler ./arche-build ../conformance/tests
      - name: Fuzz the parser
        run: cd /tmp && python3 -I $GITHUB_WORKSPACE/compiler/fuzz.py $GITHUB_WORKSPACE/compiler/build/arche 60
      - name: Differential, stage0 against the Arche compiler
        run: make -C compiler differential CC=${{ matrix.cc }}
      - name: Install lld, gdb and clang 20
        run: sudo apt-get update && sudo apt-get install -y lld gdb clang-20
      - name: The compiler's own backend and linker, all the tests, the ABI suite, and a session in gdb
        run: REQUIRE_GDB=1 make -C compiler check-own CC=${{ matrix.cc }}
      # With clang 20: clang 18, the image's, now and then makes other code
      # from the same IR (bootstrap.sh), and the binaries then differ.
      - name: Bootstrap, stage2 == stage3
        run: CC=${{ matrix.cc }} CLANG=clang-20 ./bootstrap.sh

  # docs/sprints.md S19: the same compiler and the same library on Windows,
  # built with clang and linked with lld-link against Win32. The image has
  # LLVM and the Windows SDK; make comes from Chocolatey. The checkout is
  # LF, as .gitattributes asks, which the compiler's own source needs.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install make
        run: choco install make --no-progress -y
      - name: Build stage0 and the Arche compiler
        run: make -C stage0 CC=clang && make -C compiler CC=clang
      - name: Compiler and std tests
        run: make -C compiler check CC=clang
      - name: Conformance tests with stage0
        run: make -C conformance check CC=clang
      - name: The build driver and the package manager
        run: make -C conformance && make -C driver && make -C driver check
      - name: Bootstrap, stage2 == stage3
        run: CC=clang ./bootstrap.sh

  # docs/sprints.md S28: ARM64 and RISC-V 64, in QEMU's user mode. binfmt runs
  # a program of another processor as the kernel would, so a test that starts
  # itself again works too.
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - name: Install lld, QEMU's user mode and clang 20
        run: sudo apt-get update && sudo apt-get install -y lld qemu-user-static binfmt-support clang-20
      - name: Build stage0, the compiler and the runner
        run: make -C stage0 && make -C compiler && make -C conformance
      - name: Conformance tests in QEMU
        run: cd compiler && ARCHE_TARGET=linux-${{ matrix.arch }} ../conformance/runner/build/runner --arch ${{ matrix.arch }} --timeout 120 --compiler ./arche-build ../conformance/tests
      - name: Conformance tests in QEMU, by the compiler's own backend and linker, with no clang and no lld
        run: cd compiler && CLANG=false LLD=false ARCHE_BACKEND=own ARCHE_TARGET=linux-${{ matrix.arch }} ../conformance/runner/build/runner --arch ${{ matrix.arch }} --timeout 120 --compiler ./arche-build ../conformance/tests
      - name: Conformance tests in QEMU, in a release build
        run: cd compiler && ARCHE_FLAGS=--release ARCHE_TARGET=linux-${{ matrix.arch }} ../conformance/runner/build/runner --arch ${{ matrix.arch }} --timeout 120 --compiler ./arche-build ../conformance/tests
      - name: A real font drawn as on x86-64, bit for bit; PngSuite decoded as there
        run: ARCHE_TARGET=linux-${{ matrix.arch }} ./interop/font.sh && ARCHE_TARGET=linux-${{ matrix.arch }} ./interop/png.sh
      - name: The ABI suite, each module by each backend
        run: QEMU=qemu-${{ matrix.arch }}-static sh compiler/abi-check.sh ${{ matrix.arch }}
      - name: Bootstrap on that processor, stage2 == stage3
        run: CLANG=clang-20 QEMU=qemu-${{ matrix.arch }}-static ./cross-bootstrap.sh ${{ matrix.arch }}

  # The compiler built with gcc's AddressSanitizer and UBSan: undefined
  # behaviour shows every time, not only on one C compiler (compiler/Makefile).
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compiler, sanitized, builds itself and every test, debug and release
        run: make -C compiler check-sanitized

  # docs/sprints.md S30: the compiler's WebAssembly backend, its tests in a
  # runtime, and the compiler on WebAssembly building itself.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasmtime and lld
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          curl -fsSL --retry 5 --retry-delay 5 -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/wasmtime-v50.0.1-x86_64-linux.tar.xz
          tar -xJf wasmtime.tar.xz
          echo "$PWD/wasmtime-v50.0.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: Build stage0, the compiler and the runner
        run: make -C stage0 && make -C compiler && make -C conformance
      - name: Conformance tests in wasmtime
        run: cd compiler && ARCHE_TARGET=wasm32-wasi ../conformance/runner/build/runner --arch wasm32 --timeout 120 --compiler ./arche-build ../conformance/tests
      - name: The runtime object, for a Linux program built on WebAssembly
        run: cd compiler && ARCHE_BACKEND=own sh ./arche-build tests/own/sample.arche build/own-sample
      - name: The compiler on WebAssembly, stage2 == stage3
        run: sh compiler/wasm-check.sh

  # docs/sprints.md S31: the WASM runtime, written in Arche, against the
  # WebAssembly spec's own tests (wasm/spec.sh fetches and converts them).
  wasm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stage0, the compiler and the runtime
        run: make -C stage0 && make -C compiler && make -C wasm
      - name: Install wasm-tools, which validates the components arche-wasm makes (S38)
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o wasm-tools.tar.gz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.219.1/wasm-tools-1.219.1-x86_64-linux.tar.gz
          tar -xzf wasm-tools.tar.gz
          echo "$PWD/wasm-tools-1.219.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: The spec's tests in the interpreter and the JIT, Nimadir's mini-apps, and WASM handlers over HTTPS
        env:
          WASM_TOOLS_REQUIRED: 1
        run: make -C wasm check
      - name: The web benchmark, against its baseline
        run: bash bench/web/run.sh

  # docs/sprints.md S16, S28: freestanding binaries, built with core and alloc
  # only, boot in QEMU on x86-64, RISC-V 64 and ARM64 and write over serial.
  freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-misc qemu-system-arm lld
          which qemu-system-riscv64 || sudo apt-get install -y qemu-system-riscv
      - name: Build the Arche compiler
        run: make -C stage0 && make -C compiler
      - name: Boot the freestanding examples
        run: ./freestanding/run.sh x86_64 riscv64 aarch64

  # docs/sprints.md S20: the crypto library runs in the same time whatever
  # its secrets are (dudect: Welch's t-test on two classes of inputs), and a
  # function that leaks on purpose is caught.
  constant-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Arche compiler
        run: make -C stage0 && make -C compiler
      - name: Time lib/crypto on fixed and random secrets
        run: ./ctcheck/run.sh

  # docs/sprints.md S21, S22: lib/tls against OpenSSL and curl, both ways,
  # lib/http against curl and Chrome, and a minute of fuzzing each.
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Arche compiler
        run: make -C stage0 && make -C compiler
      - name: Interop with OpenSSL and curl
        run: ./interop/tls.sh
      - name: Fuzz TLS
        run: ./fuzz/tls.sh 60
      - name: HTTP interop with curl and Chrome
        run: ./interop/http.sh
      - name: Fuzz HTTP
        run: ./fuzz/http.sh 60
      - name: A web application on lib/web over HTTPS, with workers, and memory that does not grow
        run: make -C examples/webapp check
      - name: The KV store under SIGKILL, 30 times
        run: make -C examples/kvcrash check

  # docs/sprints.md S35: the libraries the phone needs: lib/font with a real
  # font, lib/image/png with PngSuite, lib/dbus with a dbus-daemon of its
  # own and dbus-send, and a minute of fuzzing each.
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Arche compiler
        run: make -C stage0 && make -C compiler
      - name: Every glyph of DejaVu Sans, and a sample of text as it was
        run: ./interop/font.sh
      - name: Fuzz lib/font
        run: ./fuzz/font.sh 60
      - name: PngSuite, every good image as expected and every broken one refused
        run: ./interop/png.sh
      - name: Fuzz lib/image/png
        run: ./fuzz/png.sh 60
      - name: D-Bus with dbus-daemon and dbus-send
        run: |
          sudo apt-get update && sudo apt-get install -y dbus-daemon dbus-bin
          ./interop/dbus.sh
      - name: Fuzz lib/dbus
        run: ./fuzz/dbus.sh 60
      - name: Install what Linux's kernel builds with, and QEMU
        run: sudo apt-get install -y flex bison libelf-dev bc qemu-system-x86
      - name: The phone's Linux kernel, kept between runs
        uses: actions/cache@v4
        with:
          path: build/linux/bzImage-*
          key: linux-${{ hashFiles('interop/linux/kernel.sh', 'interop/linux/phone.config') }}
      - name: An Arche init as Linux's first process, drawing through DRM, hearing evdev
        run: ./interop/linux/run.sh

  # docs/sprints.md S24, S25: the build driver and the package manager. A
  # build from the cache is bit-identical to a clean one, every conformance
  # test passes when each module is compiled on its own, and packages with
  # a bad hash or signature are refused.
  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build the Arche compiler and the driver
        run: make -C stage0 && make -C compiler && make -C conformance && make -C driver
      - name: Cached builds, signed packages over HTTPS, a language server session
        run: make -C driver check
      - name: Fuzz the language server's message parser
        run: ./fuzz/lsp.sh 60
      - name: Conformance tests, one object per module
        run: cd compiler && ../conformance/runner/build/runner --timeout 60 --compiler ./arche-build-units ../conformance/tests

  # docs/sprints.md S34: two machines build the same bytes. stage1 is built
  # from stage0's C by each system's own gcc, then builds the compiler's
  # source to release IR and to an object by its own backend.
  reproducible:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The compiler's own source, built on this system
        run: sh ./reproducible.sh | tee hashes-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt

  reproducible-compare:
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: The same bytes on both
        run: |
          cat hashes-*/hashes-*.txt
          diff hashes-ubuntu-24.04/hashes-ubuntu-24.04.txt hashes-ubuntu-22.04/hashes-ubuntu-22.04.txt

  # docs/sprints.md S34: the release archive, made after the benchmarks hold
  # their baseline, and then unpacked on a machine with no C compiler and
  # no LLVM, where it builds a program and runs it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang 20
        run: sudo apt-get update && sudo apt-get install -y clang-20
      - name: Build stage0, the compiler and the runtime, and wabt for the handler
        run: make -C stage0 && make -C compiler && make -C wasm && sh wasm/spec.sh wasm/build/arche-wasm i32
      - name: The web benchmark must hold its baseline
        run: bash bench/web/run.sh
      - name: The archive
        run: CLANG=clang-20 sh ./dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/dist/*.tar.gz

  clean-machine:
    needs: release
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Unpacked, a program built and run, with no C compiler
        run: sh ./dist-check.sh arche-*.tar.gz

